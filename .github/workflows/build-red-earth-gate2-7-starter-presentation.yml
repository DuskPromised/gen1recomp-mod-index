name: Build Red Earth Gate 2.7 Starter First Presentation
on:
  workflow_dispatch:
  push:
    branches: ["gate2-7-starter-first-presentation"]
    paths:
      - "mods/red-earth-gate2-starter-presentation-fix/**"
      - "tools/build_gate2_7.py"
      - ".github/workflows/build-red-earth-gate2-7-starter-presentation.yml"
permissions:
  contents: write
concurrency:
  group: gate2-7-starter-first-presentation
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: bryanthaboi/gen1recomp
          ref: e2114f7c85795d52903ea98deab493a4f181bace
          path: engine-reference
      - name: Install validation tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
      - name: Audit timing-only module scope
        run: |
          luac -p mods/red-earth-gate2-starter-presentation-fix/main.lua
          python - <<'PY'
          from pathlib import Path
          s=Path('mods/red-earth-gate2-starter-presentation-fix/main.lua').read_text()
          required=['Pokemon.new','DexEntryMenu','activePreviewSpecies','battle.started','gen2_shiny_sparkle.mp3','makeGuaranteedShiny','0.2.7']
          for x in required: assert x in s,x
          forbidden=['resolveBattleScale','battleScale','registerSpriteProvider','world.talk','pokemon.evolved','Nature','Solitary Reign','Distance']
          for x in forbidden: assert x not in s,x
          assert 'end, -50)' in s,'must run after Kaizo species swap'
          print('PASS: creation/preview/sparkle timing only; no scale/gameplay hooks')
          PY
      - name: Package from exact device-green 0.2.6 baseline
        run: python tools/build_gate2_7.py package engine-reference/tools/cartkit.py
      - name: Publish immutable 0.2.7 module prerelease
        run: |
          if ! gh release view v0.2.7 >/dev/null 2>&1; then
            gh release create v0.2.7 --target "$GITHUB_SHA" --prerelease --title "Red Earth Gate 2.7 starter first-presentation fix" --notes "Timing-only follow-up to device-green 0.2.6. Makes the transformed Oak Fennekin/regional starter shiny at creation, shows shiny Oak acceptance/Dex preview art, and supplies the accepted gold/lilac shiny send-out sparkle+sound. No scaling, evolution, starter-selection, Nature, passive, or Irregular-art changes."
          fi
          name="red_earth_gate2_starter_presentation_fix-0.2.7.zip"
          path="site/data/mods/DuskPromised@red_earth_gate2_starter_presentation_fix/$name"
          mkdir -p /tmp/gate27-existing
          if gh release download v0.2.7 --pattern "$name" --dir /tmp/gate27-existing; then
            cmp "$path" "/tmp/gate27-existing/$name"
          else
            gh release upload v0.2.7 "$path"
          fi
      - name: Pack and strict-validate 0.2.7 cart
        run: |
          python engine-reference/tools/cartkit.py pack cart_source/gate_2_irregular_shiny_test -o site/data/carts/DuskPromised@gate_2_irregular_shiny_test/gate_2_irregular_shiny_test-0.2.7.g1rcart --online
          python engine-reference/tools/cartkit.py validate cart_source/gate_2_irregular_shiny_test --online --strict
          python tools/build_gate2_7.py metadata engine-reference/tools/cartkit.py
      - name: Verify accepted 0.2.6 content remained pinned
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('.')
          cart=json.loads((root/'cart_source/gate_2_irregular_shiny_test/cart.json').read_text())
          assert cart['version']=='0.2.7'
          assert cart['load_order'][-1]=='red_earth_gate2_starter_presentation_fix'
          prior=cart['mods'][:-1]
          for p in prior:
            if not p['id'].startswith('red_earth_'): continue
            z=root/f"site/data/mods/DuskPromised@{p['id']}/{p['id']}-{p['version']}.zip"
            assert z.exists(),z
            got=hashlib.sha256(z.read_bytes()).hexdigest()
            assert got==p['sha256'],(p['id'],got,p['sha256'])
          print('PASS: all accepted 0.2.6 Red Earth module hashes unchanged')
          PY
      - name: Attach 0.2.7 cart and checksums
        run: |
          mkdir -p /tmp/gate27-existing
          for path in site/data/carts/DuskPromised@gate_2_irregular_shiny_test/gate_2_irregular_shiny_test-0.2.7.g1rcart cart_source/gate_2_irregular_shiny_test/gate-2-sha256sums.txt; do
            name=$(basename "$path")
            if gh release download v0.2.7 --pattern "$name" --dir /tmp/gate27-existing; then
              cmp "$path" "/tmp/gate27-existing/$name"
            else
              gh release upload v0.2.7 "$path"
            fi
          done
      - name: Commit verified 0.2.7 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/red-earth-gate2-starter-presentation-fix cart_source/gate_2_irregular_shiny_test carts/gate_2_irregular_shiny_test.index.json site/data/index.json
          git add custom_mods/red_earth_gate2_starter_presentation_fix.index.json custom_mods/red_earth_gate2_starter_presentation_fix.sha256
          git add -f site/data/mods/DuskPromised@red_earth_gate2_starter_presentation_fix site/data/carts/DuskPromised@gate_2_irregular_shiny_test/gate_2_irregular_shiny_test-0.2.7.g1rcart
          if ! git diff --cached --quiet; then
            git commit -m "Publish Gate 2.7 starter first-presentation test cart"
            git push origin HEAD:gate2-7-starter-first-presentation
          fi
