name: Build Red Earth Philosopher Stones cart

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cart_source/red_earth_philosophers_stones/**"
      - ".github/workflows/build-red-earth-philosophers-stones.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: red-earth-philosophers-stones-cart-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read cart version
        run: |
          version="$(python - <<'PY'
          import json
          print(json.load(open("cart_source/red_earth_philosophers_stones/cart.json", encoding="utf-8"))["version"])
          PY
          )"
          echo "CART_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building cart version $version"

      - name: Audit Philosopher Stones dependencies and overlaps
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cart=json.loads(Path("cart_source/red_earth_philosophers_stones/cart.json").read_text())
          index=json.loads(Path("site/data/index.json").read_text())
          by_id={m["id"]:m for m in index.get("mods",[])}
          pins=cart["mods"]
          ids=[m["id"] for m in pins]
          active=set(ids)

          assert cart["version"]=="1.0.7", cart["version"]
          assert len(ids)==len(set(ids)), "duplicate mod ids"
          assert cart["load_order"]==ids, "load_order must match pin order"

          def dep_id(spec): return spec.split("@",1)[0]
          missing=[]
          conflicts=[]
          for pin in pins:
              assert pin["id"] in by_id, f"{pin['id']} missing from live index"
              meta=by_id[pin["id"]]
              for dep in meta.get("dependencies",[]):
                  if dep_id(dep) not in active: missing.append((pin["id"],dep))
              for con in meta.get("conflicts",[]):
                  if dep_id(con) in active: conflicts.append((pin["id"],con))
          assert not missing, f"missing dependencies: {missing}"
          assert not conflicts, f"declared conflicts: {conflicts}"

          required={
            "gen1_kaizo","DRAMALESS_SHAPE","overworld_wild_spawns",
            "red_earth_kaizo_bridge","philosopher_stones","irregular_origin","MULTI_SAVE_SLOTS",
            "quest_system","advanced_box_system","modern_bag"
          }
          assert required <= active, required-active

          omitted={
            "BATTLE_ART_VOXEL_FORK","DRAMATIC_SHAPE","TERRARIUM","potato_voxel",
            "gen151","pokedex_plus","moves_manager","move_learn_stats",
            "mew_mirage","shiny_starters_gifts","take_last_starter",
            "SHINY_POKEMON","kanto_achievements","eevee_three_stones","crystal_onix",
            "level_match_mod","overworld_encounters"
          }
          assert not (omitted & active), f"overlap mods present: {sorted(omitted & active)}"

          kaizo=next(m for m in pins if m["id"]=="gen1_kaizo")
          assert kaizo["version"]=="0.8.3"
          assert kaizo.get("options",{}).get("battle")=="static", \
              "Kaizo native scaling must stay static; bridge owns upward-only dynamic scaling"

          dramaless=next(m for m in pins if m["id"]=="DRAMALESS_SHAPE")
          assert dramaless["version"]=="2.0.4"

          bridge=next(m for m in pins if m["id"]=="red_earth_kaizo_bridge")
          assert bridge["version"]=="1.0.1", bridge
          assert bridge["sha256"]=="b427b2ad5af11dc6aa5086831124e1e4942f16ca04c4249fca7c1657e56a9f7e"
          bridge_meta=by_id["red_earth_kaizo_bridge"]
          assert bridge_meta.get("version")=="1.0.1", bridge_meta.get("version")
          bopts=bridge.get("options",{})
          assert bopts.get("dynamic_wilds") is True
          assert bopts.get("dynamic_trainers") is True
          assert bopts.get("shiny_starters") is True
          assert bopts.get("second_starter") is False,               "Irregular route already has Psydren + one regional companion"

          stones=next(m for m in pins if m["id"]=="philosopher_stones")
          assert stones["version"]=="1.1.0", stones
          assert stones["repo"]=="DuskPromised/gen1recomp-mod-index"
          assert stones["sha256"]=="b62e8eb02c983b6aa4c0e28e62b8eb00b6aec502ae3202ea81bbe3be0a5836e0"
          stone_meta=by_id["philosopher_stones"]
          assert stone_meta.get("version")=="1.1.0", stone_meta.get("version")

          irregular=next(m for m in pins if m["id"]=="irregular_origin")
          assert irregular["version"]=="1.0.7", irregular
          assert irregular["repo"]=="DuskPromised/gen1recomp-mod-index"
          assert irregular["sha256"]=="37ad54f3597f2cbf9fe24a840d1c80a70259786a5951cd16c7ddb41e7d1a7785"
          irregular_meta=by_id["irregular_origin"]
          assert irregular_meta.get("version")=="1.0.7"
          assert irregular_meta.get("source_zip")=="irregular_origin-1.0.7.zip"
          assert irregular_meta.get("downloadURL","").endswith("/irregular_origin-1.0.7.zip")
          irregular_sha=Path("custom_mods/irregular_origin.sha256").read_text().split()[0]
          assert irregular["sha256"]==irregular_sha, (irregular["sha256"],irregular_sha)
          assert irregular_meta.get("optional_dependencies")==[
              "red_earth_kaizo_bridge@>=1.0.0 <2.0.0",
              "philosopher_stones@>=1.1.0 <2.0.0",
          ], irregular_meta.get("optional_dependencies")
          assert set(irregular_meta.get("optional_integrations",[]))=={
              "overworld_wild_spawns","DRAMALESS_SHAPE"
          }, irregular_meta.get("optional_integrations")
          wilds=next(m for m in pins if m["id"]=="overworld_wild_spawns")
          assert wilds["version"]=="2.1.9", wilds
          assert wilds["sha256"]=="0ac172cd0f463f78f9544d8a02cc31596655699e879d9a02895ae5aef22923dd"
          assert ids.index("philosopher_stones") < ids.index("irregular_origin"), \
              "Irregular Origin must load after Philosopher Stones for resonance wrapping"

          multi=next(m for m in pins if m["id"]=="MULTI_SAVE_SLOTS")
          assert multi["version"]=="1.0.1"
          assert multi["repo"]=="DuskPromised/gen1recomp-mod-index"

          menus=next(m for m in pins if m["id"]=="gen1-better-menus")
          opts=menus.get("options",{})
          assert opts.get("modern_pc_ui") is False
          assert opts.get("modern_bag_ui") is False
          assert opts.get("modern_party_ui") is True
          assert opts.get("modern_battle_ui")=="mod"

          assert ids.index("gen1_kaizo") < ids.index("philosopher_stones")
          assert ids.index("philosopher_stones") < ids.index("irregular_origin")
          assert ids.index("irregular_origin") < ids.index("overworld_wild_spawns"),               "Wilds must load after Irregular species registration for follower sprites"
          assert ids.index("overworld_wild_spawns") < ids.index("red_earth_kaizo_bridge")
          print(f"AUDIT PASS: {len(ids)} mods, Irregular Origin + Greater Stones pinned, no missing dependencies or declared conflicts")
          PY

      - name: Build clean 256px cart label
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path("site/data/carts/DuskPromised@red_earth_philosophers_stones/thumbnail.jpg")
          dst=Path("cart_source/red_earth_philosophers_stones/label.png")
          im=Image.open(src).convert("RGB").resize((256,256),Image.Resampling.LANCZOS)
          im.save(dst,"PNG",optimize=True)
          print("label:",dst.stat().st_size,"bytes")
          PY

      - name: Fetch official cartkit
        run: |
          curl -fsSL https://raw.githubusercontent.com/bryanthaboi/gen1recomp/dev/tools/cartkit.py -o /tmp/cartkit.py

      - name: Pack cart
        run: |
          python /tmp/cartkit.py pack cart_source/red_earth_philosophers_stones \
            -o "/tmp/red_earth_philosophers_stones-$CART_VERSION.g1rcart"

      - name: Publish cart, metadata, and version archive
        run: |
          mkdir -p "site/data/carts/DuskPromised@red_earth_philosophers_stones"
          cp "/tmp/red_earth_philosophers_stones-$CART_VERSION.g1rcart" \
            "site/data/carts/DuskPromised@red_earth_philosophers_stones/red_earth_philosophers_stones-$CART_VERSION.g1rcart"
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path

          source_path=Path("cart_source/red_earth_philosophers_stones/cart.json")
          source=json.loads(source_path.read_text(encoding="utf-8"))
          version=source["version"]
          folder=Path("site/data/carts/DuskPromised@red_earth_philosophers_stones")
          cart=folder/f"red_earth_philosophers_stones-{version}.g1rcart"
          body=cart.read_bytes()
          url_base="https://duskpromised.github.io/gen1recomp-mod-index/data/carts/DuskPromised@red_earth_philosophers_stones"

          meta={
            "folder":"DuskPromised@red_earth_philosophers_stones",
            "id":source["id"],
            "title":source["title"],
            "author":source["author"],
            "summary":source["summary"],
            "version":version,
            "base":"red",
            "seal":"sealed+",
            "shell":source["shell"],
            "finish":source["finish"],
            "tags":[
              "cart","bundle","red","kanto","kaizo","908 pokemon","dramaless",
              "voxel","dynamic difficulty","second starter","shiny starters",
              "philosopher stones","greater stones","alchemy journal","quests",
              "quality of life","cart-aware saves"
            ],
            "repo":"https://github.com/DuskPromised/gen1recomp-mod-index",
            "github":"DuskPromised/gen1recomp-mod-index",
            "automatic_version_check":False,
            "mods":source["mods"],
            "load_order":source["load_order"],
            "description_url":"data/carts/DuskPromised@red_earth_philosophers_stones/description.md",
            "versions_url":"data/carts/DuskPromised@red_earth_philosophers_stones/versions.json",
            "latest":{
              "version":version,"name":version,"prerelease":False,
              "zip":{
                "name":cart.name,
                "url":f"{url_base}/{cart.name}",
                "size":len(body),
                "sha256":hashlib.sha256(body).hexdigest()
              }
            },
            "update_check":"ok",
            "thumbnail":"data/carts/DuskPromised@red_earth_philosophers_stones/thumbnail.jpg"
          }
          Path("carts/red_earth_philosophers_stones.index.json").write_text(
            json.dumps(meta,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")

          def semver_key(v):
              return tuple(int(x) for x in v.split("."))

          versions=[]
          pattern=re.compile(r"^red_earth_philosophers_stones-(\d+\.\d+\.\d+)\.g1rcart$")
          for path in folder.glob("red_earth_philosophers_stones-*.g1rcart"):
              match=pattern.match(path.name)
              if not match: continue
              v=match.group(1)
              raw=path.read_bytes()
              versions.append({
                "version":v,
                "name":path.name,
                "url":f"{url_base}/{path.name}",
                "size":len(raw),
                "sha256":hashlib.sha256(raw).hexdigest(),
              })
          versions.sort(key=lambda row: semver_key(row["version"]), reverse=True)

          known={row["version"] for row in versions}
          assert version in known, (version,known)
          assert "1.0.0" in known, "v1.0.0 archive must remain downloadable"
          archive={
            "schema_version":1,
            "cart_id":source["id"],
            "title":source["title"],
            "latest":version,
            "versions":versions,
          }
          (folder/"versions.json").write_text(
            json.dumps(archive,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")

          print("cart bytes:",len(body))
          print("cart sha256:",hashlib.sha256(body).hexdigest())
          print("archived versions:",", ".join(row["version"] for row in versions))
          PY

      - name: Verify version archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.load(open("cart_source/red_earth_philosophers_stones/cart.json",encoding="utf-8"))
          archive=json.load(open("site/data/carts/DuskPromised@red_earth_philosophers_stones/versions.json",encoding="utf-8"))
          versions=[row["version"] for row in archive["versions"]]
          assert archive["latest"]==source["version"]
          assert source["version"] in versions
          assert "1.0.0" in versions
          assert len(versions)==len(set(versions))
          for row in archive["versions"]:
              assert Path("site/data/carts/DuskPromised@red_earth_philosophers_stones",row["name"]).is_file()
          print("VERSION ARCHIVE PASS:", versions)
          PY

      - name: Commit cart release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "cart_source/red_earth_philosophers_stones/label.png" \
            "site/data/carts/DuskPromised@red_earth_philosophers_stones/thumbnail.jpg" \
            "site/data/carts/DuskPromised@red_earth_philosophers_stones/"*.g1rcart \
            "site/data/carts/DuskPromised@red_earth_philosophers_stones/versions.json" \
            "carts/red_earth_philosophers_stones.index.json"
          if git diff --cached --quiet; then
            echo "Cart $CART_VERSION already published."
          else
            git commit -m "Publish Red Earth Philosopher Stones v$CART_VERSION"
            git pull --rebase origin main
            git push
          fi

      - name: Refresh combined Gen 1 index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync.yml --ref main
