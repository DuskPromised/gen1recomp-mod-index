name: Build Red Earth split-mod recovery cart

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cart_source/red_earth_philosophers_stones/**"
      - ".github/workflows/build-red-earth-philosophers-stones.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: red-earth-split-recovery-cart
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit known-good split stack
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cart=json.loads(Path("cart_source/red_earth_philosophers_stones/cart.json").read_text())
          assert cart["version"]=="1.2.5"
          ids=[m["id"] for m in cart["mods"]]
          assert ids==cart["load_order"]
          assert len(ids)==len(set(ids))
          required={
            "gen1_kaizo":"0.8.3",
            "DRAMALESS_SHAPE":"2.0.4",
            "crystal_animated_sprites_with_shiny_visuals":"2.0.3",
            "SHINY_POKEMON":"1.0.1",
            "leaf_avatar":"2.0.0",
            "philosopher_stones":"1.1.0",
            "irregular_origin":"1.0.9",
            "red_earth_irregular_upgrade":"1.0.0",
            "overworld_wild_spawns":"2.1.9",
            "red_earth_kaizo_bridge":"1.0.3",
            "red_earth_shiny_bridge":"1.0.0",
            "red_earth_regional_shiny_art":"1.0.1",
            "red_earth_shiny_fx_bridge":"1.0.1",
          }
          for mid,version in required.items():
              m=next((x for x in cart["mods"] if x["id"]==mid),None)
              assert m is not None, mid
              assert m["version"]==version,(mid,m["version"],version)
          assert "red_earth_irregular" not in ids
          shinyfx=next(m for m in cart["mods"] if m["id"]=="SHINY_POKEMON")
          assert shinyfx["sha256"]=="90d2be6fcec1383bb9beec5df9038308b68fa903eb179840b344c7b6e48ccb59"
          so=shinyfx.get("options",{})
          assert so.get("enabled") is True
          assert so.get("shiny_rate")=="off"
          assert so.get("recolor") is False
          assert so.get("sparkles") is True
          assert so.get("debug_ow") is False
          assert ids.index("red_earth_shiny_bridge") == ids.index("red_earth_kaizo_bridge") + 1
          assert ids.index("red_earth_regional_shiny_art") == ids.index("red_earth_shiny_bridge") + 1
          assert ids.index("red_earth_shiny_fx_bridge") == ids.index("red_earth_regional_shiny_art") + 1
          regional=next(m for m in cart["mods"] if m["id"]=="red_earth_regional_shiny_art")
          regional_sha="0488849afd40321deb12ea242632a8bce56e72a7112fdcc7bb85be813c36fa7e"
          assert regional["sha256"]==regional_sha
          regional_archive=Path("site/data/mods/DuskPromised@red_earth_regional_shiny_art/red_earth_regional_shiny_art-1.0.1.zip")
          assert regional_archive.is_file(), "Regional Shiny Art archive is not published"
          import hashlib
          assert hashlib.sha256(regional_archive.read_bytes()).hexdigest()==regional_sha
          fxbridge=next(m for m in cart["mods"] if m["id"]=="red_earth_shiny_fx_bridge")
          fx_sha="ddbc5ed492a57e176d36b9838b0a4d7513626a845c5b1781638f3b0b5c42ffa7"
          assert fxbridge["sha256"]==fx_sha
          fx_archive=Path("site/data/mods/DuskPromised@red_earth_shiny_fx_bridge/red_earth_shiny_fx_bridge-1.0.1.zip")
          assert fx_archive.is_file(), "Shiny FX Bridge archive is not published"
          assert hashlib.sha256(fx_archive.read_bytes()).hexdigest()==fx_sha
          assert ids.index("red_earth_irregular_upgrade") == ids.index("irregular_origin") + 1
          patch=next(m for m in cart["mods"] if m["id"]=="red_earth_irregular_upgrade")
          expected_patch_sha="e320c30845e5d6559527f942cf47bc055a43716fa99655fb30c6721fa9f9b96b"
          assert patch["sha256"]==expected_patch_sha
          archive=Path("site/data/mods/DuskPromised@red_earth_irregular_upgrade/red_earth_irregular_upgrade-1.0.0.zip")
          assert archive.is_file(), "Irregular Upgrade archive is not published yet"
          import hashlib
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==expected_patch_sha

          voxel=next(m for m in cart["mods"] if m["id"]=="DRAMALESS_SHAPE")
          assert voxel.get("options",{}).get("renderDistanceSetting")==64
          wilds=next(m for m in cart["mods"] if m["id"]=="overworld_wild_spawns")
          w=wilds.get("options",{})
          assert w.get("sprite_style")=="followers"
          assert w.get("follow_control")=="trainer"
          assert w.get("follower_count")==1
          assert w.get("trainer_trail") is False
          shiny=next(m for m in cart["mods"] if m["id"]=="red_earth_shiny_bridge")
          shiny_sha="fe63e1b7ee0e8bb18767ac4c29bb850c845ea368c5f21d9ef8fe32f8cb7569ee"
          assert shiny["sha256"]==shiny_sha
          shiny_archive=Path("site/data/mods/DuskPromised@red_earth_shiny_bridge/red_earth_shiny_bridge-1.0.0.zip")
          assert shiny_archive.is_file(), "Shiny Bridge archive is not published yet"
          assert hashlib.sha256(shiny_archive.read_bytes()).hexdigest()==shiny_sha
          shiny_meta=json.loads(Path("custom_mods/red_earth_shiny_bridge.index.json").read_text())
          assert shiny_meta["sha256"]==shiny_sha
          assert shiny_meta["version"]=="1.0.0"

          bridge=next(m for m in cart["mods"] if m["id"]=="red_earth_kaizo_bridge")
          b=bridge.get("options",{})
          assert b.get("dynamic_wilds") is True
          assert b.get("dynamic_trainers") is True
          assert b.get("second_starter") is True
          assert b.get("shiny_starters") is True
          print("SPLIT STACK + HARDENED SHINY ART + FX TARGET AUDIT PASS:",len(ids),"mods")
          PY

      - name: Fetch official cartkit
        run: curl -fsSL https://raw.githubusercontent.com/bryanthaboi/gen1recomp/dev/tools/cartkit.py -o /tmp/cartkit.py

      - name: Pack cart
        run: |
          version="$(python -c 'import json; print(json.load(open("cart_source/red_earth_philosophers_stones/cart.json"))["version"])')"
          echo "CART_VERSION=$version" >> "$GITHUB_ENV"
          python /tmp/cartkit.py pack cart_source/red_earth_philosophers_stones -o "/tmp/red_earth_philosophers_stones-$version.g1rcart"

      - name: Publish cart metadata and version archive
        run: |
          mkdir -p "site/data/carts/DuskPromised@red_earth_philosophers_stones"
          cp "/tmp/red_earth_philosophers_stones-$CART_VERSION.g1rcart" "site/data/carts/DuskPromised@red_earth_philosophers_stones/red_earth_philosophers_stones-$CART_VERSION.g1rcart"
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          source=json.loads(Path("cart_source/red_earth_philosophers_stones/cart.json").read_text())
          version=source["version"]
          folder=Path("site/data/carts/DuskPromised@red_earth_philosophers_stones")
          cart=folder/f"red_earth_philosophers_stones-{version}.g1rcart"
          raw=cart.read_bytes()
          base="https://duskpromised.github.io/gen1recomp-mod-index/data/carts/DuskPromised@red_earth_philosophers_stones"
          public_title="Red Earth: The Irregular and The Philosopher Stones"
          meta={
            "folder":"DuskPromised@red_earth_philosophers_stones",
            "id":source["id"],
            "title":public_title,
            "author":source["author"],
            "summary":"Known-good split stack plus hardened regional shiny art routing and corrected follower sparkle targeting.",
            "version":version,
            "base":"red",
            "seal":"sealed+",
            "shell":source["shell"],
            "finish":source["finish"],
            "tags":["cart","bundle","red","kaizo","split mods","custom pokemon","philosopher stone","irregular upgrade","shiny bridge","recovery"],
            "repo":"https://github.com/DuskPromised/gen1recomp-mod-index",
            "github":"DuskPromised/gen1recomp-mod-index",
            "automatic_version_check":False,
            "mods":source["mods"],
            "load_order":source["load_order"],
            "description_url":"data/carts/DuskPromised@red_earth_philosophers_stones/description.md",
            "versions_url":"data/carts/DuskPromised@red_earth_philosophers_stones/versions.json",
            "latest":{"version":version,"name":version,"prerelease":False,"zip":{
              "name":cart.name,"url":f"{base}/{cart.name}",
              "size":len(raw),"sha256":hashlib.sha256(raw).hexdigest()}},
            "update_check":"ok",
            "thumbnail":"data/carts/DuskPromised@red_earth_philosophers_stones/thumbnail.jpg"
          }
          Path("carts/red_earth_philosophers_stones.index.json").write_text(json.dumps(meta,indent=2,ensure_ascii=False)+"\n")
          pat=re.compile(r"^red_earth_philosophers_stones-(\d+\.\d+\.\d+)\.g1rcart$")
          versions=[]
          for p in folder.glob("red_earth_philosophers_stones-*.g1rcart"):
              m=pat.match(p.name)
              if not m: continue
              b=p.read_bytes()
              versions.append({"version":m.group(1),"name":p.name,"url":f"{base}/{p.name}",
                               "size":len(b),"sha256":hashlib.sha256(b).hexdigest()})
          versions.sort(key=lambda x:tuple(map(int,x["version"].split("."))),reverse=True)
          (folder/"versions.json").write_text(json.dumps({
              "schema_version":1,"cart_id":source["id"],"title":public_title,
              "latest":version,"versions":versions
          },indent=2,ensure_ascii=False)+"\n")
          print("RECOVERY CART PASS",version,len(raw),hashlib.sha256(raw).hexdigest())
          PY

      - name: Commit recovery cart release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "cart_source/red_earth_philosophers_stones/cart.json"                   "site/data/carts/DuskPromised@red_earth_philosophers_stones/"*.g1rcart                   "site/data/carts/DuskPromised@red_earth_philosophers_stones/versions.json"                   "carts/red_earth_philosophers_stones.index.json"
          if git diff --cached --quiet; then
            echo "Recovery cart already current."
          else
            git commit -m "Publish Red Earth split-mod recovery v$CART_VERSION"
            git pull --rebase origin main
            git push
          fi

      - name: Refresh combined index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync.yml --ref main
