name: Publish Red Earth Shiny Bridge

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "mods/red-earth-shiny-bridge/**"
      - ".github/workflows/publish-red-earth-shiny-bridge.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: red-earth-shiny-bridge-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: "1.0.0"
      EXPECTED_SHA256: "fe63e1b7ee0e8bb18767ac4c29bb850c845ea368c5f21d9ef8fe32f8cb7569ee"
    steps:
      - uses: actions/checkout@v4

      - name: Audit source ownership
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("mods/red-earth-shiny-bridge")
          m=json.loads((root/"manifest.json").read_text())
          assert m["id"]=="red_earth_shiny_bridge"
          assert m["version"]=="1.0.0"
          main=(root/"main.lua").read_text()
          for needle in [
              'mod.hooks:wrap("script.command"',
              '"give_pokemon"',
              'redEarthGuaranteedShiny',
              'mon.shiny = true',
              'pokemon.evolved',
              'game.ready',
              'map.entered',
              'FENNEKIN=true',
              'SPRIGATITO=true',
          ]:
              assert needle in main, needle
          for forbidden in [
              'battle.overlay','SpriteRenderer','PaletteFX','BattleState.draw',
              'PHILOSOPHER_','ANSEM','MELONY'
          ]:
              assert forbidden not in main, forbidden
          print("SHINY BRIDGE SOURCE AUDIT PASS")
          PY

      - name: Build deterministic mod ZIP
        run: |
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          src=Path("mods/red-earth-shiny-bridge")
          out=Path("/tmp/red_earth_shiny_bridge-1.0.0.zip")
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
              for name in ("manifest.json","main.lua","README.md"):
                  info=zipfile.ZipInfo("red_earth_shiny_bridge/"+name,date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  z.writestr(info,(src/name).read_bytes())
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          print("SHA",sha)
          assert sha=="fe63e1b7ee0e8bb18767ac4c29bb850c845ea368c5f21d9ef8fe32f8cb7569ee", sha
          PY

      - name: Publish archive
        run: |
          out="site/data/mods/DuskPromised@red_earth_shiny_bridge"
          mkdir -p "$out"
          cp "/tmp/red_earth_shiny_bridge-$VERSION.zip" "$out/red_earth_shiny_bridge-$VERSION.zip"
          printf "%s  red_earth_shiny_bridge-%s.zip\n" "$EXPECTED_SHA256" "$VERSION" > custom_mods/red_earth_shiny_bridge.sha256

      - name: Commit Shiny Bridge release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f             "site/data/mods/DuskPromised@red_earth_shiny_bridge/red_earth_shiny_bridge-$VERSION.zip"             "custom_mods/red_earth_shiny_bridge.sha256"
          if git diff --cached --quiet; then
            echo "Shiny Bridge already current."
          else
            git commit -m "Publish Red Earth Shiny Bridge v$VERSION"
            git pull --rebase origin main
            git push
          fi

      - name: Refresh index and cart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run sync.yml --ref main
          gh workflow run build-red-earth-philosophers-stones.yml --ref main
