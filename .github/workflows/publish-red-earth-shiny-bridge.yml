name: Publish Red Earth Shiny Bridge

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "mods/red-earth-shiny-bridge/**"
      - ".github/workflows/publish-red-earth-shiny-bridge.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: red-earth-shiny-bridge-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: "1.0.0"
    steps:
      - uses: actions/checkout@v4

      - name: Audit source ownership
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("mods/red-earth-shiny-bridge")
          m=json.loads((root/"manifest.json").read_text())
          assert m["id"]=="red_earth_shiny_bridge"
          assert m["version"]=="1.0.0"
          main=(root/"main.lua").read_text()
          for needle in [
              'mod.hooks:wrap("script.command"',
              '"give_pokemon"',
              'redEarthGuaranteedShiny',
              'mon.shiny = true',
              'pokemon.evolved',
              'game.ready',
              'map.entered',
              'FENNEKIN=true',
              'SPRIGATITO=true',
          ]:
              assert needle in main, needle
          # The bridge must NOT compete for presentation ownership.
          for forbidden in [
              'battle.overlay',
              'SpriteRenderer',
              'PaletteFX',
              'BattleState.draw',
              'PHILOSOPHER_',
              'ANSEM',
              'MELONY',
          ]:
              assert forbidden not in main, forbidden
          print("SHINY BRIDGE SOURCE AUDIT PASS")
          PY

      - name: Build mod ZIP
        run: |
          rm -rf /tmp/red_earth_shiny_bridge
          mkdir -p /tmp/red_earth_shiny_bridge
          cp mods/red-earth-shiny-bridge/manifest.json /tmp/red_earth_shiny_bridge/
          cp mods/red-earth-shiny-bridge/main.lua /tmp/red_earth_shiny_bridge/
          cp mods/red-earth-shiny-bridge/README.md /tmp/red_earth_shiny_bridge/
          cd /tmp
          zip -qr "red_earth_shiny_bridge-$VERSION.zip" red_earth_shiny_bridge
          echo "BRIDGE_SHA=$(sha256sum "red_earth_shiny_bridge-$VERSION.zip" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Publish archive and pin metadata/cart
        run: |
          out="site/data/mods/DuskPromised@red_earth_shiny_bridge"
          mkdir -p "$out"
          cp "/tmp/red_earth_shiny_bridge-$VERSION.zip" "$out/red_earth_shiny_bridge-$VERSION.zip"
          printf "%s  red_earth_shiny_bridge-%s.zip\n" "$BRIDGE_SHA" "$VERSION" > custom_mods/red_earth_shiny_bridge.sha256

          python - <<'PY'
          import json, os
          from pathlib import Path
          sha=os.environ["BRIDGE_SHA"]
          meta_path=Path("custom_mods/red_earth_shiny_bridge.index.json")
          meta=json.loads(meta_path.read_text())
          meta["sha256"]=sha
          meta_path.write_text(json.dumps(meta,indent=2)+"\n")

          cart_path=Path("cart_source/red_earth_philosophers_stones/cart.json")
          cart=json.loads(cart_path.read_text())
          cart["version"]="1.2.2"
          cart["summary"]="Known-good split stack plus separate Irregular Upgrade and Shiny Bridge layers."
          mods=[m for m in cart["mods"] if m["id"]!="red_earth_shiny_bridge"]
          bridge={
            "id":"red_earth_shiny_bridge",
            "source":"github",
            "repo":"DuskPromised/gen1recomp-mod-index",
            "version":"1.0.0",
            "sha256":sha
          }
          idx=next(i for i,m in enumerate(mods) if m["id"]=="red_earth_kaizo_bridge")
          mods.insert(idx+1,bridge)
          cart["mods"]=mods
          cart["load_order"]=[m["id"] for m in mods]
          cart_path.write_text(json.dumps(cart,indent=2)+"\n")
          print("PINNED",sha)
          PY

      - name: Commit Shiny Bridge release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f             "site/data/mods/DuskPromised@red_earth_shiny_bridge/red_earth_shiny_bridge-$VERSION.zip"             "custom_mods/red_earth_shiny_bridge.index.json"             "custom_mods/red_earth_shiny_bridge.sha256"             "cart_source/red_earth_philosophers_stones/cart.json"
          if git diff --cached --quiet; then
            echo "Shiny Bridge already current."
          else
            git commit -m "Publish Red Earth Shiny Bridge v$VERSION"
            git pull --rebase origin main
            git push
          fi

      - name: Refresh index and cart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run sync.yml --ref main
          gh workflow run build-red-earth-philosophers-stones.yml --ref main
