name: Build Red Earth NEXT Gate 0

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cart_source/red_earth_next/**"
      - "carts/red_earth_next.index.json"
      - ".github/workflows/build-red-earth-next.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: red-earth-next-cart-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Audit Gate 0 foundation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cart = json.loads(Path("cart_source/red_earth_next/cart.json").read_text())
          assert cart["id"] == "red_earth_next"
          assert cart["version"] == "0.0.2"
          assert cart["base"] == "red"
          assert cart["seal"] == "sealed+"
          assert cart.get("speeds") == [1], "Gate 0 performance testing must stay at 1x game speed"

          expected = [
              "gen1_kaizo",
              "potato_voxel",
              "overworld_wild_spawns",
              "performance_monitor",
          ]
          ids = [m["id"] for m in cart["mods"]]
          assert ids == expected, (ids, expected)
          assert cart["load_order"] == expected
          assert len(ids) == len(set(ids))

          by_id = {m["id"]: m for m in cart["mods"]}
          assert by_id["gen1_kaizo"]["version"] == "0.8.3"
          assert by_id["gen1_kaizo"]["options"] == {"battle": "static"}

          potato = by_id["potato_voxel"]
          assert potato["version"] == "1.9.6"
          assert "options" not in potato, "PotatoVoxel settings must remain user-persistent during Gate 0"

          wilds = by_id["overworld_wild_spawns"]
          assert wilds["version"] == "2.1.9"
          assert "options" not in wilds, "Wilds settings must remain user-persistent during Gate 0"

          assert by_id["performance_monitor"]["version"] == "1.4.1"

          forbidden = {
              "BATTLE_ART_VOXEL_FORK", "DRAMATIC_SHAPE", "DRAMALESS_SHAPE",
              "FOLLOWERS_EX", "PokePCFollowers_VoxelMerge",
              "irregular_origin", "philosopher_stones",
              "red_earth_kaizo_bridge", "red_earth_irregular_upgrade",
              "red_earth_shiny_bridge", "red_earth_regional_shiny_art",
              "red_earth_shiny_fx_bridge", "red_earth_dramaless_battle_bridge",
              "crystal_animated_sprites_with_shiny_visuals",
          }
          assert forbidden.isdisjoint(ids), sorted(forbidden.intersection(ids))

          print("GATE 0.0.2 AUDIT PASS:", " -> ".join(ids))
          PY

      - name: Fetch official cartkit
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/bryanthaboi/gen1recomp/dev/tools/cartkit.py \
            -o /tmp/cartkit.py

      - name: Pack Gate 0 cart
        run: |
          python /tmp/cartkit.py pack cart_source/red_earth_next \
            -o /tmp/red_earth_next-0.0.2.g1rcart

      - name: Publish Gate 0 cart
        run: |
          mkdir -p "site/data/carts/DuskPromised@red_earth_next"
          cp /tmp/red_earth_next-0.0.2.g1rcart \
            "site/data/carts/DuskPromised@red_earth_next/red_earth_next-0.0.2.g1rcart"
          cp "site/data/carts/DuskPromised@red_earth/thumbnail.jpg" \
            "site/data/carts/DuskPromised@red_earth_next/thumbnail.jpg"

          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          cart_path = Path("site/data/carts/DuskPromised@red_earth_next/red_earth_next-0.0.2.g1rcart")
          meta_path = Path("carts/red_earth_next.index.json")
          source_path = Path("cart_source/red_earth_next/cart.json")

          meta = json.loads(meta_path.read_text(encoding="utf-8"))
          source = json.loads(source_path.read_text(encoding="utf-8"))
          body = cart_path.read_bytes()

          for key in ("title","author","summary","version","base","seal","speeds",
                      "shell","finish","mods","load_order"):
              if key in source:
                  meta[key] = source[key]

          meta["latest"] = {
              "version": source["version"],
              "name": source["version"],
              "prerelease": True,
              "zip": {
                  "name": cart_path.name,
                  "url": "https://duskpromised.github.io/gen1recomp-mod-index/data/carts/DuskPromised@red_earth_next/" + cart_path.name,
                  "size": len(body),
                  "sha256": hashlib.sha256(body).hexdigest()
              }
          }
          meta["thumbnail"] = "data/carts/DuskPromised@red_earth_next/thumbnail.jpg"
          meta["update_check"] = "ok"
          meta_path.write_text(json.dumps(meta, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          print("cart bytes:", len(body))
          print("cart sha256:", hashlib.sha256(body).hexdigest())
          PY

      - name: Commit Gate 0 publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "site/data/carts/DuskPromised@red_earth_next/thumbnail.jpg" \
            "site/data/carts/DuskPromised@red_earth_next/red_earth_next-0.0.2.g1rcart" \
            "carts/red_earth_next.index.json"
          if git diff --cached --quiet; then
            echo "Gate 0 cart is already published."
            exit 0
          fi
          git commit -m "Publish Red Earth NEXT Gate 0 v0.0.2"
          git pull --rebase origin main
          git push

      - name: Refresh combined Gen 1 index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync.yml --ref main
