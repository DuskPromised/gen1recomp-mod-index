name: Publish Red Earth Dramaless Battle Bridge

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "mods/red-earth-dramaless-battle-bridge/**"
      - ".github/workflows/publish-red-earth-dramaless-battle-bridge.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: red-earth-dramaless-battle-bridge-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: "1.0.1"
    steps:
      - uses: actions/checkout@v4

      - name: Audit source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("mods/red-earth-dramaless-battle-bridge")
          m=json.loads((root/"manifest.json").read_text())
          assert m["id"]=="red_earth_dramaless_battle_bridge"
          assert m["version"]=="1.0.1"
          main=(root/"main.lua").read_text()
          for needle in [
              "voxelCardProvider",
              "ENGINE_RESOLVE",
              'onlySide ~= "player"',
              'side == "back"',
              "IRR_PSYDREN",
              "IRR_VESPERIS",
              "IRR_SOLIPSDION",
              "PSYDREN",
              "_redEarthBattleScaleBridge",
          ]:
              assert needle in main, needle
          assert "DRAMALESS_SHAPE" in m["dependencies"][0]
          print("DRAMALESS BATTLE BRIDGE SOURCE AUDIT PASS")
          PY

      - name: Build deterministic ZIP
        run: |
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          src=Path("mods/red-earth-dramaless-battle-bridge")
          out=Path("/tmp/red_earth_dramaless_battle_bridge-1.0.1.zip")
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
              for name in ("manifest.json","main.lua","README.md"):
                  info=zipfile.ZipInfo("red_earth_dramaless_battle_bridge/"+name,date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  z.writestr(info,(src/name).read_bytes())
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          Path("/tmp/bridge.sha").write_text(sha)
          print("SHA",sha)
          PY

      - name: Publish archive and index metadata
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          version="1.0.1"
          sha=Path("/tmp/bridge.sha").read_text().strip()
          folder=Path("site/data/mods/DuskPromised@red_earth_dramaless_battle_bridge")
          folder.mkdir(parents=True,exist_ok=True)
          archive=f"red_earth_dramaless_battle_bridge-{version}.zip"
          shutil.copy2("/tmp/"+archive, folder/archive)
          meta={
            "folder":"DuskPromised@red_earth_dramaless_battle_bridge",
            "id":"red_earth_dramaless_battle_bridge",
            "title":"Red Earth Dramaless Battle Bridge",
            "author":"Adam M. Aguilera",
            "version":version,
            "categories":["COMPATIBILITY"],
            "tags":["red earth","dramaless","voxel","battle","back sprite","scale","bridge"],
            "api":2,
            "profile":"content",
            "game_version":">=0.2.21 <2.0.0",
            "dependencies":["DRAMALESS_SHAPE@>=2.0.4 <3.0.0"],
            "optional_dependencies":[
              "red_earth_regional_shiny_art@>=1.0.3 <2.0.0",
              "irregular_origin@>=1.0.9 <2.0.0"
            ],
            "conflicts":["red_earth_irregular"],
            "affects_link":True,
            "experimental":False,
            "repo":"https://github.com/DuskPromised/gen1recomp-mod-index",
            "github":"DuskPromised/gen1recomp-mod-index",
            "license":"MIT",
            "downloadURL":f"https://duskpromised.github.io/gen1recomp-mod-index/data/mods/DuskPromised@red_earth_dramaless_battle_bridge/{archive}",
            "source_zip":archive,
            "sha256":sha,
            "summary":"Restores native player-back sprite scale and grounding for the Irregular custom line inside Dramaless voxel-card capture.",
            "source_scope":"DuskPromised original compatibility patch",
            "update_check":"off"
          }
          Path("custom_mods/red_earth_dramaless_battle_bridge.index.json").write_text(json.dumps(meta,indent=2)+"\n")
          Path("custom_mods/red_earth_dramaless_battle_bridge.sha256").write_text(f"{sha}  {archive}\n")
          print("PUBLISH METADATA",sha)
          PY

      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            "site/data/mods/DuskPromised@red_earth_dramaless_battle_bridge/red_earth_dramaless_battle_bridge-$VERSION.zip" \
            "custom_mods/red_earth_dramaless_battle_bridge.index.json" \
            "custom_mods/red_earth_dramaless_battle_bridge.sha256"
          if git diff --cached --quiet; then
            echo "Dramaless Battle Bridge already current."
          else
            git commit -m "Publish Red Earth Dramaless Battle Bridge v$VERSION"
            git pull --rebase origin main
            git push
          fi

      - name: Refresh combined index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync.yml --ref main
