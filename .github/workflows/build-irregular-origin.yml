name: Build Irregular Origin

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "mods/irregular-origin/**"
      - ".github/workflows/build-irregular-origin.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: irregular-origin-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate authored production sprites
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path("mods/irregular-origin/assets")
          expected={}
          for stem in ("psydren","vesperis","solipsdion"):
              for shiny in ("","_shiny"):
                  expected[f"{stem}_front{shiny}.png"]=(64,64)
                  expected[f"{stem}_back{shiny}.png"]=(64,64)
                  expected[f"{stem}_menu{shiny}.png"]=(64,64)
                  expected[f"{stem}_icon{shiny}.png"]=(16,32)
                  expected[f"{stem}_follower{shiny}.png"]=(16,96)
          assert len(expected)==30
          for name,size in expected.items():
              path=root/name
              assert path.is_file() and path.stat().st_size>100, path
              with Image.open(path) as im:
                  im.verify()
              with Image.open(path) as im:
                  assert im.size==size, (path,im.size,size)
                  rgba=im.convert("RGBA")
                  alpha=rgba.getchannel("A")
                  assert alpha.getbbox() is not None, f"{path}: empty alpha"
          print("IRREGULAR ORIGIN: 30 AUTHORED SPRITES PASS")
          PY

      - name: Syntax and content audit
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac -p mods/irregular-origin/main.lua
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("mods/irregular-origin")
          m=json.loads((root/"manifest.json").read_text())
          idx=json.loads(Path("custom_mods/irregular_origin.index.json").read_text())
          src=(root/"main.lua").read_text()
          assert m["id"]=="irregular_origin" and m["version"]=="1.0.6"
          assert idx["version"]=="1.0.6"
          assert idx.get("optional_dependencies")==m.get("optional_dependencies")
          assert set(idx.get("optional_integrations",[]))=={"overworld_wild_spawns","DRAMALESS_SHAPE"}
          for needle in [
            "IRR_PSYDREN","IRR_VESPERIS","IRR_SOLIPSDION",
            "IRR_SOVEREIGN_RAGE","IRR_SERAPHS_VERDICT",
            "PSYCHIC","GHOST","DRAGON","EVENT_GOT_STARTER",
            "PHILOSOPHER_RUBY","RESONANCE","records end",
            "pokemon.sprite","pokemon.icon","frontShiny","backShiny",
            "menuShiny","iconShiny","followerShiny","overworld_wild_spawns"
          ]:
            assert needle in src, needle
          for stem in ("psydren","vesperis","solipsdion"):
              assert f'assets/{stem}_back.png' in src
              assert f'assets/{stem}_front_shiny.png' in src
              assert f'assets/{stem}_follower_shiny.png' in src
          print("IRREGULAR ORIGIN LUA/AUDIT PASS")
          PY

      - name: Package deterministic ZIP
        run: |
          mkdir -p "site/data/mods/DuskPromised@irregular_origin"
          python - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          src=Path("mods/irregular-origin")
          out=Path("site/data/mods/DuskPromised@irregular_origin/irregular_origin-1.0.6.zip")
          files=["main.lua","manifest.json","README.md","LICENSE"]
          files += [str(p.relative_to(src)) for p in sorted((src/"assets").glob("*.png"))]
          with zipfile.ZipFile(out,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for name in files:
                  info=zipfile.ZipInfo("irregular_origin/"+name)
                  info.date_time=(2026,1,1,0,0,0)
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o100644<<16
                  z.writestr(info,(src/name).read_bytes())
          body=out.read_bytes()
          sha=hashlib.sha256(body).hexdigest()
          Path("custom_mods/irregular_origin.sha256").write_text(sha+"  "+out.name+"\n")
          print("sha256:",sha,"bytes:",len(body))
          PY

      - name: Commit packaged mod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            "mods/irregular-origin/assets/"*.png \
            "site/data/mods/DuskPromised@irregular_origin/irregular_origin-1.0.6.zip" \
            "custom_mods/irregular_origin.sha256"
          if git diff --cached --quiet; then
            echo "Irregular Origin archive already current."
          else
            git commit -m "Publish Irregular Origin v1.0.6"
            git pull --rebase origin main
            git push
          fi

      - name: Refresh combined Gen 1 index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync.yml --ref main
