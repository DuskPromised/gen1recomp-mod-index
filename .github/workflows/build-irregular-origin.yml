name: Build Irregular Origin

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "mods/irregular-origin/**"
      - ".github/workflows/build-irregular-origin.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: irregular-origin-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate functional concept battle sprites
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path("mods/irregular-origin/assets")
          # Vesperis and Solipsdion currently use approved 2-frame pixel icons
          # as their source concept art. Extract frame 1 and scale it cleanly
          # to 64x64 so the first playable release has valid battle cards.
          for stem in ("vesperis","solipsdion"):
              icon=Image.open(root/f"{stem}_icon.png").convert("RGBA")
              frame=icon.crop((0,0,16,16))
              front=frame.resize((64,64),Image.Resampling.NEAREST)
              front.save(root/f"{stem}_front.png","PNG",optimize=True)
          PY

      - name: Syntax and content audit
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac -p mods/irregular-origin/main.lua
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("mods/irregular-origin")
          m=json.loads((root/"manifest.json").read_text())
          src=(root/"main.lua").read_text()
          assert m["id"]=="irregular_origin" and m["version"]=="1.0.1"
          for needle in [
            "IRR_PSYDREN","IRR_VESPERIS","IRR_SOLIPSDION",
            "IRR_SOVEREIGN_RAGE","IRR_SERAPHS_VERDICT",
            "PSYCHIC","GHOST","DRAGON","EVENT_GOT_STARTER",
            "PHILOSOPHER_RUBY","RESONANCE","records end"
          ]:
            assert needle in src, needle
          for asset in [
            "psydren_front.png","psydren_icon.png",
            "vesperis_front.png","vesperis_icon.png",
            "solipsdion_front.png","solipsdion_icon.png"
          ]:
            p=root/"assets"/asset
            assert p.is_file() and p.stat().st_size>100, asset
          print("IRREGULAR ORIGIN AUDIT PASS")
          PY

      - name: Package deterministic ZIP
        run: |
          mkdir -p "site/data/mods/DuskPromised@irregular_origin"
          python - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          src=Path("mods/irregular-origin")
          out=Path("site/data/mods/DuskPromised@irregular_origin/irregular_origin-1.0.1.zip")
          files=["main.lua","manifest.json","README.md","LICENSE"]
          files += [str(p.relative_to(src)) for p in sorted((src/"assets").glob("*.png"))]
          with zipfile.ZipFile(out,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for name in files:
              info=zipfile.ZipInfo("irregular_origin/"+name)
              info.date_time=(2026,1,1,0,0,0)
              info.compress_type=zipfile.ZIP_DEFLATED
              info.external_attr=0o100644<<16
              z.writestr(info,(src/name).read_bytes())
          body=out.read_bytes()
          sha=hashlib.sha256(body).hexdigest()
          Path("custom_mods/irregular_origin.sha256").write_text(sha+"  "+out.name+"\n")
          print("sha256:",sha,"bytes:",len(body))
          PY

      - name: Commit packaged mod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            "site/data/mods/DuskPromised@irregular_origin/irregular_origin-1.0.1.zip" \
            "custom_mods/irregular_origin.sha256"
          if git diff --cached --quiet; then
            echo "Irregular Origin archive already current."
          else
            git commit -m "Publish Irregular Origin v1.0.1"
            git pull --rebase origin main
            git push
          fi

      - name: Refresh combined Gen 1 index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync.yml --ref main
