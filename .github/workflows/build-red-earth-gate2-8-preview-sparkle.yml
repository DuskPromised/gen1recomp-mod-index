name: Build Red Earth Gate 2.8 Preview + Sparkle
on:
  workflow_dispatch:
  push:
    branches: ["gate2-8-preview-sparkle-rebuild"]
    paths:
      - "mods/red-earth-gate2-starter-preview-sparkle-fix/**"
      - "tools/build_gate2_8.py"
      - ".github/workflows/build-red-earth-gate2-8-preview-sparkle.yml"
permissions:
  contents: write
concurrency:
  group: gate2-8-preview-sparkle-rebuild
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v4
        with:
          repository: bryanthaboi/gen1recomp
          ref: e2114f7c85795d52903ea98deab493a4f181bace
          path: engine-reference
      - name: Install validation tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
      - name: Audit presentation-only scope
        run: |
          luac -p mods/red-earth-gate2-starter-preview-sparkle-fix/main.lua
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('mods/red-earth-gate2-starter-preview-sparkle-fix/main.lua').read_text()
          for x in ['DexEntryMenu.new','forceOwned == true','_front_shiny.png','battle.started','gen2_shiny_sparkle.mp3','0.2.8']:
              assert x in s,x
          for x in ['script.command','Pokemon.new','resolveBattleScale','battleScale','pokemon.evolved','makeGuaranteedShiny(']:
              assert x not in s,x
          assert not re.search(r'\bmon\.shiny\s*=(?!=)',s)
          assert not re.search(r'\bmon\.dvs\s*=(?!=)',s)
          print('PASS: direct preview replacement + read-only sparkle only')
          PY
      - name: Package from exact device-green 0.2.6 baseline
        run: python tools/build_gate2_8.py package engine-reference/tools/cartkit.py
      - name: Publish immutable 0.2.8 module prerelease
        run: |
          if ! gh release view v0.2.8 >/dev/null 2>&1; then
            gh release create v0.2.8 --target "$GITHUB_SHA" --prerelease --title "Red Earth Gate 2.8 preview + sparkle rebuild" --notes "Replacement for failed 0.2.7, rebuilt directly from device-green 0.2.6. Does not modify the working Fennekin shiny contract. It only replaces the constructed forceOwned starter preview sprite with the proven shiny front asset and adds the gold/lilac send-out sparkle for already-marked guaranteed shiny starters."
          fi
          name="red_earth_gate2_starter_preview_sparkle_fix-0.2.8.zip"
          path="site/data/mods/DuskPromised@red_earth_gate2_starter_preview_sparkle_fix/$name"
          mkdir -p /tmp/gate28-existing
          if gh release download v0.2.8 --pattern "$name" --dir /tmp/gate28-existing; then cmp "$path" "/tmp/gate28-existing/$name"; else gh release upload v0.2.8 "$path"; fi
      - name: Pack and strict-validate 0.2.8 cart
        run: |
          python engine-reference/tools/cartkit.py pack cart_source/gate_2_irregular_shiny_test -o site/data/carts/DuskPromised@gate_2_irregular_shiny_test/gate_2_irregular_shiny_test-0.2.8.g1rcart --online
          python engine-reference/tools/cartkit.py validate cart_source/gate_2_irregular_shiny_test --online --strict
          python tools/build_gate2_8.py metadata engine-reference/tools/cartkit.py
      - name: Verify 0.2.6 stays byte-pinned and 0.2.7 is absent
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('.');cart=json.loads((root/'cart_source/gate_2_irregular_shiny_test/cart.json').read_text())
          assert cart['version']=='0.2.8'
          ids=[p['id'] for p in cart['mods']]
          assert 'red_earth_gate2_starter_presentation_fix' not in ids
          assert ids[-1]=='red_earth_gate2_starter_preview_sparkle_fix'
          for p in cart['mods'][:-1]:
              if not p['id'].startswith('red_earth_'): continue
              z=root/f"site/data/mods/DuskPromised@{p['id']}/{p['id']}-{p['version']}.zip"
              assert hashlib.sha256(z.read_bytes()).hexdigest()==p['sha256'],p['id']
          print('PASS: accepted 0.2.6 modules unchanged; failed 0.2.7 not carried forward')
          PY
      - name: Attach cart and checksums
        run: |
          mkdir -p /tmp/gate28-existing
          for path in site/data/carts/DuskPromised@gate_2_irregular_shiny_test/gate_2_irregular_shiny_test-0.2.8.g1rcart cart_source/gate_2_irregular_shiny_test/gate-2-sha256sums.txt; do
            name=$(basename "$path"); if gh release download v0.2.8 --pattern "$name" --dir /tmp/gate28-existing; then cmp "$path" "/tmp/gate28-existing/$name"; else gh release upload v0.2.8 "$path"; fi
          done
      - name: Commit verified 0.2.8 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/red-earth-gate2-starter-preview-sparkle-fix tools/build_gate2_8.py cart_source/gate_2_irregular_shiny_test carts/gate_2_irregular_shiny_test.index.json site/data/index.json
          git add custom_mods/red_earth_gate2_starter_preview_sparkle_fix.index.json custom_mods/red_earth_gate2_starter_preview_sparkle_fix.sha256
          git add -f site/data/mods/DuskPromised@red_earth_gate2_starter_preview_sparkle_fix site/data/carts/DuskPromised@gate_2_irregular_shiny_test/gate_2_irregular_shiny_test-0.2.8.g1rcart
          if ! git diff --cached --quiet; then
            git commit -m "Publish Gate 2.8 preview and sparkle rebuild"
            git push origin HEAD:gate2-8-preview-sparkle-rebuild
          fi
