name: Publish Red Earth Rebuild Lab

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "custom_mods/red_earth_irregular_rebuild.index.json"
      - "cart_source/red_earth_rebuild_lab/**"
      - "carts/red_earth_rebuild_lab.index.json"
      - ".github/workflows/publish-red-earth-rebuild-lab.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: red-earth-rebuild-lab-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MOD_VERSION: "0.1.2"
      CART_VERSION: "0.1.1"
      EXPECTED_SHA256: "fd3727045030855bf52f26b1b1c768437526dae1c7be4ec51cb7bbca852c1c3a"
      SOURCE_URL: "https://at.adobe.com/FJoqQoCvdA7RFgxM"

    steps:
      - uses: actions/checkout@v4

      - name: Download audited rebuild candidate
        run: |
          curl -fL --retry 4 --retry-delay 2 "$SOURCE_URL" -o /tmp/red_earth_irregular_rebuild.zip
          test "$(sha256sum /tmp/red_earth_irregular_rebuild.zip | awk '{print $1}')" = "$EXPECTED_SHA256"

      - name: Audit rebuild archive and lab scope
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path

          archive=Path("/tmp/red_earth_irregular_rebuild.zip")
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert not any(n.startswith("__MACOSX/") for n in names)
              manifest=json.loads(z.read("red_earth_irregular_rebuild/manifest.json"))
              assert manifest["id"]=="red_earth_irregular_rebuild"
              assert manifest["version"]=="0.1.2"
              assert manifest["priority"]==1100
              main=z.read("red_earth_irregular_rebuild/main.lua").decode("utf-8")
              assert "_redEarthFollowerMeta" in main
              assert 'battleScaleFront = 0.94' in main
              assert 'battleScaleFront = 1.00' in main
              assert 'battleScaleFront = 1.08' in main
              for required in [
                  "red_earth_irregular_rebuild/assets/pokemon/psydren/shiny_front.png",
                  "red_earth_irregular_rebuild/assets/pokemon/vesperis/shiny_front.png",
                  "red_earth_irregular_rebuild/assets/pokemon/solipsdion/shiny_front.png",
                  "red_earth_irregular_rebuild/assets/player/ansem_overworld.png",
                  "red_earth_irregular_rebuild/assets/rival/melony_front.png",
              ]:
                  assert required in names, required

          cart=json.loads(Path("cart_source/red_earth_rebuild_lab/cart.json").read_text())
          assert cart["id"]=="red_earth_rebuild_lab"
          assert cart["version"]=="0.1.1"
          assert cart["seal"]=="open"
          assert cart["speeds"]==[1]
          expected=[
              "gen1_kaizo",
              "potato_voxel",
              "crystal_animated_sprites_with_shiny_visuals",
              "red_earth_irregular_rebuild",
              "performance_monitor",
          ]
          ids=[m["id"] for m in cart["mods"]]
          assert ids==expected, (ids, expected)
          assert cart["load_order"]==expected
          by={m["id"]:m for m in cart["mods"]}
          assert by["red_earth_irregular_rebuild"]["version"]=="0.1.2"
          assert by["red_earth_irregular_rebuild"]["sha256"]=="fd3727045030855bf52f26b1b1c768437526dae1c7be4ec51cb7bbca852c1c3a"
          assert "overworld_wild_spawns" not in by
          assert "red_earth_regional_shiny_art" not in by
          assert "red_earth_irregular" not in by
          assert "irregular_origin" not in by
          print("REBUILD LAB AUDIT PASS")
          PY

      - name: Publish rebuild mod archive
        run: |
          out="site/data/mods/DuskPromised@red_earth_irregular_rebuild"
          mkdir -p "$out"
          cp /tmp/red_earth_irregular_rebuild.zip "$out/red_earth_irregular_rebuild-$MOD_VERSION.zip"
          printf "%s  red_earth_irregular_rebuild-%s.zip\n" "$EXPECTED_SHA256" "$MOD_VERSION" > custom_mods/red_earth_irregular_rebuild.sha256

      - name: Fetch cartkit
        run: |
          curl -fsSL https://raw.githubusercontent.com/bryanthaboi/gen1recomp/dev/tools/cartkit.py -o /tmp/cartkit.py

      - name: Pack rebuild lab cart
        run: |
          rm -rf /tmp/red_earth_rebuild_lab
          cp -R cart_source/red_earth_rebuild_lab /tmp/red_earth_rebuild_lab
          cp cart_source/red_earth_voxel_lab/label.png /tmp/red_earth_rebuild_lab/label.png
          python /tmp/cartkit.py pack /tmp/red_earth_rebuild_lab -o /tmp/red_earth_rebuild_lab-$CART_VERSION.g1rcart

      - name: Publish lab cart and metadata
        run: |
          mkdir -p "site/data/carts/DuskPromised@red_earth_rebuild_lab"
          cp /tmp/red_earth_rebuild_lab-$CART_VERSION.g1rcart "site/data/carts/DuskPromised@red_earth_rebuild_lab/red_earth_rebuild_lab-$CART_VERSION.g1rcart"
          cp "site/data/carts/DuskPromised@red_earth_next/thumbnail.jpg" "site/data/carts/DuskPromised@red_earth_rebuild_lab/thumbnail.jpg"

          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          source=json.loads(Path("cart_source/red_earth_rebuild_lab/cart.json").read_text())
          meta_path=Path("carts/red_earth_rebuild_lab.index.json")
          meta=json.loads(meta_path.read_text())
          cart_path=Path("site/data/carts/DuskPromised@red_earth_rebuild_lab/red_earth_rebuild_lab-0.1.1.g1rcart")
          body=cart_path.read_bytes()

          for key in ("title","author","summary","version","base","seal","speeds","shell","finish","mods","load_order"):
              if key in source:
                  meta[key]=source[key]

          meta["latest"]={
              "version": source["version"],
              "name": source["version"],
              "prerelease": True,
              "zip": {
                  "name": cart_path.name,
                  "url": "https://duskpromised.github.io/gen1recomp-mod-index/data/carts/DuskPromised@red_earth_rebuild_lab/" + cart_path.name,
                  "size": len(body),
                  "sha256": hashlib.sha256(body).hexdigest(),
              },
          }
          meta["thumbnail"]="data/carts/DuskPromised@red_earth_rebuild_lab/thumbnail.jpg"
          meta["update_check"]="ok"
          meta_path.write_text(json.dumps(meta,indent=2)+"\n")
          print("CART SHA", hashlib.sha256(body).hexdigest())
          PY

      - name: Commit test publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            "site/data/mods/DuskPromised@red_earth_irregular_rebuild/red_earth_irregular_rebuild-$MOD_VERSION.zip" \
            "custom_mods/red_earth_irregular_rebuild.sha256"
          git add \
            "site/data/carts/DuskPromised@red_earth_rebuild_lab/red_earth_rebuild_lab-$CART_VERSION.g1rcart" \
            "site/data/carts/DuskPromised@red_earth_rebuild_lab/thumbnail.jpg" \
            "carts/red_earth_rebuild_lab.index.json"

          if git diff --cached --quiet; then
            echo "Rebuild test publication already current."
          else
            git commit -m "Publish Red Earth rebuild lab"
            git pull --rebase origin main
            git push
          fi

      - name: Refresh combined index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync.yml --ref main
