name: Publish Red Earth Shiny FX Bridge

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "mods/red-earth-shiny-fx-bridge/**"
      - ".github/workflows/publish-red-earth-shiny-fx-bridge.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: red-earth-shiny-fx-bridge-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: "1.0.5"
    steps:
      - uses: actions/checkout@v4

      - name: Audit source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("mods/red-earth-shiny-fx-bridge")
          m=json.loads((root/"manifest.json").read_text())
          assert m["id"]=="red_earth_shiny_fx_bridge"
          assert m["version"]=="1.0.5"
          main=(root/"main.lua").read_text()
          for needle in [
              "_pokepcAsPokemon",
              "pokepcTrailers",
              "pokepcShiny",
              "Pipelines.drawWorld",
              "Stats.isShiny",
              "trainerControlMode",
              "ow.entities",
              "px + 8",
              "py + 16",
              "localCx",
              "localCy",
              "drawSubtleBurst",
                            '"battle.overlay"',
          ]:
              assert needle in main, needle
          for forbidden in ["pokemon.sprite", "pokemon.icon", "give_pokemon"]:
              assert forbidden not in main, forbidden
          print("SHINY FX BRIDGE SOURCE AUDIT PASS")
          PY

      - name: Build deterministic ZIP
        run: |
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          src=Path("mods/red-earth-shiny-fx-bridge")
          out=Path("/tmp/red_earth_shiny_fx_bridge-1.0.5.zip")
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
              for name in ("manifest.json","main.lua","README.md"):
                  info=zipfile.ZipInfo("red_earth_shiny_fx_bridge/"+name,date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  z.writestr(info,(src/name).read_bytes())
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          Path("/tmp/fx.sha").write_text(sha)
          print("SHA",sha)
          PY

      - name: Publish archive and index metadata
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          version="1.0.5"
          sha=Path("/tmp/fx.sha").read_text().strip()
          folder=Path("site/data/mods/DuskPromised@red_earth_shiny_fx_bridge")
          folder.mkdir(parents=True,exist_ok=True)
          archive=f"red_earth_shiny_fx_bridge-{version}.zip"
          shutil.copy2("/tmp/"+archive, folder/archive)
          meta={
            "folder":"DuskPromised@red_earth_shiny_fx_bridge",
            "id":"red_earth_shiny_fx_bridge",
            "title":"Red Earth Shiny FX Bridge",
            "author":"Adam M. Aguilera",
            "version":version,
            "categories":["COMPATIBILITY","VISUAL"],
            "tags":["red earth","shiny","sparkle","follower","voxel","bridge"],
            "api":2,
            "profile":"content",
            "game_version":">=0.2.21 <2.0.0",
            "dependencies":[
              "red_earth_shiny_bridge@>=1.0.0 <2.0.0",
              "SHINY_POKEMON@>=1.0.1 <2.0.0",
              "overworld_wild_spawns@>=2.1.9 <3.0.0"
            ],
            "optional_dependencies":["DRAMALESS_SHAPE@>=2.0.4 <3.0.0"],
            "conflicts":["red_earth_irregular"],
            "affects_link":True,
            "experimental":False,
            "repo":"https://github.com/DuskPromised/gen1recomp-mod-index",
            "github":"DuskPromised/gen1recomp-mod-index",
            "license":"MIT",
            "downloadURL":f"https://duskpromised.github.io/gen1recomp-mod-index/data/mods/DuskPromised@red_earth_shiny_fx_bridge/{archive}",
            "source_zip":archive,
            "sha256":sha,
            "summary":"Subtle Red Earth shiny battle/follower FX with Wilds voxel-overlay transform anchoring, and stale trainer/player target cleanup.",
            "source_scope":"DuskPromised original compatibility patch",
            "update_check":"off"
          }
          Path("custom_mods/red_earth_shiny_fx_bridge.index.json").write_text(json.dumps(meta,indent=2)+"\n")
          Path("custom_mods/red_earth_shiny_fx_bridge.sha256").write_text(f"{sha}  {archive}\n")
          print("PUBLISH METADATA",sha)
          PY

      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f             "site/data/mods/DuskPromised@red_earth_shiny_fx_bridge/red_earth_shiny_fx_bridge-$VERSION.zip"             "custom_mods/red_earth_shiny_fx_bridge.index.json"             "custom_mods/red_earth_shiny_fx_bridge.sha256"
          if git diff --cached --quiet; then
            echo "Shiny FX Bridge already current."
          else
            git commit -m "Publish Red Earth Shiny FX Bridge v$VERSION"
            git pull --rebase origin main
            git push
          fi

      - name: Refresh combined index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync.yml --ref main
