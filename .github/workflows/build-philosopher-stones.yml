name: Build Philosopher Stones

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "mods/philosopher-stones/**"
      - ".github/workflows/build-philosopher-stones.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: philosopher_stones-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and behavior audit
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac -p mods/philosopher-stones/main.lua
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("mods/philosopher-stones")
          manifest=json.loads((root/"manifest.json").read_text())
          src=(root/"main.lua").read_text()
          assert manifest["id"]=="philosopher_stones"
          assert manifest["version"]=="1.1.0"
          for needle in [
              "PHILOSOPHER_RUBY","PHILOSOPHER_SAPPHIRE","PHILOSOPHER_EMERALD",
              "PHILOSOPHER_AMETHYST","PHILOSOPHER_OBSIDIAN","PHILOSOPHER_SOLAR",
              "PHILOSOPHER_MOON","PHILOSOPHER_TEMPEST","battle.damage",
              "battle.accuracy","battle.status_inflicted","battle.turn_ended",
              "ui.party.submenu","ui.start_menu.items","ALCHEMY JOURNAL",
              'map_scripts:register("MT_MOON_B2F"',
              'map_scripts:register("POKEMON_TOWER_7F"',
              'map_scripts:register("POKEMON_MANSION_B1F"',
              'map_scripts:register("POWER_PLANT"'
          ]:
              assert needle in src, needle
          assert "philosopherStone" in src
          assert "EVENT_BEAT_GHOST_MAROWAK" in src
          assert "EVENT_BEAT_ZAPDOS" in src
          assert "VOLCANOBADGE" in src
          assert "MOON_STONE" in src
          print("PHILOSOPHER STONES v1.1.0 AUDIT PASS")
          PY

      - name: Package deterministic v1.1.0 ZIP
        run: |
          mkdir -p "site/data/mods/DuskPromised@philosopher_stones"
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          src=Path("mods/philosopher-stones")
          out=Path("site/data/mods/DuskPromised@philosopher_stones/philosopher_stones-1.1.0.zip")
          files=["main.lua","manifest.json","README.md","LICENSE"]
          with zipfile.ZipFile(out,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for name in files:
                  info=zipfile.ZipInfo("philosopher_stones/"+name)
                  info.date_time=(2026,1,1,0,0,0)
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o100644 << 16
                  z.writestr(info,(src/name).read_bytes())
          body=out.read_bytes()
          sha=hashlib.sha256(body).hexdigest()
          Path("custom_mods/philosopher_stones.sha256").write_text(sha+"  "+out.name+"\n")
          print("bytes:",len(body))
          print("sha256:",sha)
          PY

      - name: Commit packaged mod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            "site/data/mods/DuskPromised@philosopher_stones/philosopher_stones-1.1.0.zip" \
            "custom_mods/philosopher_stones.sha256"
          if git diff --cached --quiet; then
            echo "Philosopher Stones v1.1.0 archive already current."
          else
            git commit -m "Publish Philosopher Stones v1.1.0"
            git pull --rebase origin main
            git push
          fi

      - name: Refresh combined Gen 1 index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync.yml --ref main
