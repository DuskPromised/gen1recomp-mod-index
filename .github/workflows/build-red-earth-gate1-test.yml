name: Build Red Earth Gate 1 Test

on:
  workflow_dispatch:
  push:
    branches: ["gate1-test-build"]
    paths:
      - "mods/red-earth-gate1-test-harness/**"
      - "custom_mods/red_earth_gate1_test_harness.index.json"
      - ".github/workflows/build-red-earth-gate1-test.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: red-earth-gate1-test-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: "0.1.0"
      CORE_SHA: "53f9e38200b3227a797b6fcf3366a64746c196186d47166e9a72300e0dfa8acf"
    steps:
      - uses: actions/checkout@v4

      - name: Validate harness source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac -p mods/red-earth-gate1-test-harness/main.lua
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("mods/red-earth-gate1-test-harness")
          m=json.loads((root/"manifest.json").read_text())
          idx=json.loads(Path("custom_mods/red_earth_gate1_test_harness.index.json").read_text())
          src=(root/"main.lua").read_text()

          assert m["id"]=="red_earth_gate1_test_harness"
          assert m["version"]=="0.1.0"
          assert idx["id"]=="red_earth_gate1_test_harness"
          assert idx["version"]=="0.1.0"
          assert "red_earth_irregular_core@>=0.1.0 <0.2.0" in m["dependencies"]

          for needle in [
            "TEXT_OAKSLAB_BULBASAUR_POKE_BALL",
            "TEXT_OAKSLAB_CHARMANDER_POKE_BALL",
            "TEXT_OAKSLAB_SQUIRTLE_POKE_BALL",
            'species=IDS.PSYDREN,level=15',
            'species=IDS.VESPERIS,level=35',
            'species=IDS.SOLIPSDION,level=50',
            '"push_screen","DexEntryMenu"',
            '"give_pokemon",test.species,test.level',
            'flags.EVENT_GOT_STARTER~=true',
            'mod.exports.testOnly=true',
          ]:
              assert needle in src, needle

          # Test harness must not implement production mechanics.
          for token in [
              "frontShiny","backShiny","mon.shiny","overworld_wild_spawns",
              "registerSpriteProvider","PHILOSOPHER_","battle.damage",
              "SOLITARY_REIGN","AETHERIC_TRANSMUTATION","MELONY","ANSEM",
          ]:
              assert token.upper() not in src.upper(), token

          print("GATE 1 TEST HARNESS SOURCE AUDIT PASS")
          PY

      - name: Package harness deterministically
        run: |
          mkdir -p site/data/mods/DuskPromised@red_earth_gate1_test_harness
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          src=Path("mods/red-earth-gate1-test-harness")
          out=Path("site/data/mods/DuskPromised@red_earth_gate1_test_harness/red_earth_gate1_test_harness-0.1.0.zip")
          files=["main.lua","manifest.json","README.md","LICENSE"]

          if out.exists(): out.unlink()
          with zipfile.ZipFile(out,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for name in files:
                  info=zipfile.ZipInfo("red_earth_gate1_test_harness/"+name)
                  info.date_time=(2026,9,16,0,0,0)
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o100644<<16
                  z.writestr(info,(src/name).read_bytes())

          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert len(z.namelist())==4
              assert not any("__MACOSX" in n for n in z.namelist())
              m=json.loads(z.read("red_earth_gate1_test_harness/manifest.json"))
              assert m["id"]=="red_earth_gate1_test_harness"
              assert m["version"]=="0.1.0"

          body=out.read_bytes()
          sha=hashlib.sha256(body).hexdigest()
          Path("/tmp/harness_sha.txt").write_text(sha)
          Path("custom_mods/red_earth_gate1_test_harness.sha256").write_text(
              sha+"  "+out.name+"\n"
          )

          idxp=Path("custom_mods/red_earth_gate1_test_harness.index.json")
          idx=json.loads(idxp.read_text())
          idx["sha256"]=sha
          idxp.write_text(json.dumps(idx,indent=2)+"\n")

          print("HARNESS_SHA="+sha)
          print("GATE 1 TEST HARNESS PACKAGE PASS")
          PY

      - name: Verify Gate 1 core package
        run: |
          test -f site/data/mods/DuskPromised@red_earth_irregular_core/red_earth_irregular_core-0.1.0.zip
          echo "$CORE_SHA  site/data/mods/DuskPromised@red_earth_irregular_core/red_earth_irregular_core-0.1.0.zip" | sha256sum -c -

      - name: Publish shared Gate 1 GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HARNESS_SHA="$(cat /tmp/harness_sha.txt)"
          cat > /tmp/sha256sums.txt <<EOF
          $CORE_SHA  red_earth_irregular_core-0.1.0.zip
          $HARNESS_SHA  red_earth_gate1_test_harness-0.1.0.zip
          EOF

          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION"               --target "$GITHUB_SHA"               --title "Red Earth Gate 1 QA v$VERSION"               --notes "Gate 1 development assets for the Irregular Core and isolated QA harness. Not a production Red Earth release."               --prerelease
          fi

          gh release upload "v$VERSION"             "site/data/mods/DuskPromised@red_earth_irregular_core/red_earth_irregular_core-0.1.0.zip"             "site/data/mods/DuskPromised@red_earth_gate1_test_harness/red_earth_gate1_test_harness-0.1.0.zip"             "/tmp/sha256sums.txt#sha256sums.txt"             --clobber

      - name: Create Gate 1 sealed test cart source
        run: |
          HARNESS_SHA="$(cat /tmp/harness_sha.txt)"
          mkdir -p cart_source/gate_1_irregular_test carts

          python - "$HARNESS_SHA" <<'PY'
          import json,struct,zlib,sys
          from pathlib import Path

          harness_sha=sys.argv[1]
          mods=[
            {
              "id":"gen1_kaizo","source":"github",
              "repo":"AyeBathingApe/gen1recomp-allgen-kaizo","version":"0.8.3",
              "sha256":"99fff33b12764496e185bc5e0c5397f0c6670f439830e54e866fd8fa82813ad2"
            },
            {
              "id":"potato_voxel","source":"github",
              "repo":"ShaneMcGovernIE/potato_voxel","version":"1.9.6",
              "sha256":"f57c83e24fd8252fdc936bc7420ea2bc0439ec253d8a0f9ba11ffa9a06ea9846",
              "options":{
                "renderScale":100,"water":"full","aa":2,"curve":1,"grid":True,
                "battles":True,"battleBack":True,"atmos":True,"weather":True,
                "shadows":True,"shadowQuality":0
              }
            },
            {
              "id":"crystal_animated_sprites_with_shiny_visuals","source":"github",
              "repo":"distilledorion-sketch/crystal_animated_sprites_with_shiny_visuals",
              "version":"2.0.3",
              "sha256":"3d2874917f03a42cbf96d0d7e1b5c19bde09a5405fe12559ac241af017155689"
            },
            {
              "id":"red_earth_irregular_core","source":"github",
              "repo":"DuskPromised/gen1recomp-mod-index","version":"0.1.0",
              "sha256":"53f9e38200b3227a797b6fcf3366a64746c196186d47166e9a72300e0dfa8acf"
            },
            {
              "id":"red_earth_gate1_test_harness","source":"github",
              "repo":"DuskPromised/gen1recomp-mod-index","version":"0.1.0",
              "sha256":harness_sha
            },
            {
              "id":"performance_monitor","source":"github",
              "repo":"notquiteog/performance_monitor","version":"1.4.1",
              "sha256":"34688ca51894ab68e4f6dad51e5ce3a0bc8c17913a45eb3d0ddb318560412379"
            }
          ]

          order=[
            "gen1_kaizo",
            "potato_voxel",
            "crystal_animated_sprites_with_shiny_visuals",
            "red_earth_irregular_core",
            "red_earth_gate1_test_harness",
            "performance_monitor",
          ]

          cart={
            "schema":1,
            "id":"gate_1_irregular_test",
            "title":"Gate 1 — Irregular Core Test",
            "version":"0.1.0",
            "author":"Adam M. Aguilera",
            "repo":"DuskPromised/gen1recomp-mod-index",
            "summary":"Gate A plus Irregular Core and isolated QA harness. No Wilds or later Red Earth systems.",
            "shell":"#24162B",
            "finish":"holo",
            "label":"label.png",
            "base":"red",
            "seal":"sealed+",
            "speeds":[1],
            "mods":mods,
            "load_order":order
          }

          Path("cart_source/gate_1_irregular_test/cart.json").write_text(
              json.dumps(cart,indent=2)+"\n"
          )

          # Neutral test label; production cart art comes much later.
          w=h=256
          rgb=(36,22,43)
          raw=b"".join(b"\x00"+bytes(rgb)*w for _ in range(h))
          def chunk(t,d):
              return struct.pack(">I",len(d))+t+d+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
          png=b"\x89PNG\r\n\x1a\n"
          png+=chunk(b"IHDR",struct.pack(">IIBBBBB",w,h,8,2,0,0,0))
          png+=chunk(b"IDAT",zlib.compress(raw,9))
          png+=chunk(b"IEND",b"")
          Path("cart_source/gate_1_irregular_test/label.png").write_bytes(png)

          idx={
            "folder":"DuskPromised@gate_1_irregular_test",
            "id":cart["id"],"title":cart["title"],"author":cart["author"],
            "version":cart["version"],"summary":cart["summary"],
            "base":cart["base"],"seal":cart["seal"],"speeds":cart["speeds"],
            "shell":cart["shell"],"finish":cart["finish"],
            "tags":["gate 1","red earth","qa","irregular core","development"],
            "repo":"https://github.com/DuskPromised/gen1recomp-mod-index",
            "automatic_version_check":False,
            "game_version":">=0.2.24 <2.0.0",
            "mods":mods,"load_order":order,"update_check":"off"
          }
          Path("carts/gate_1_irregular_test.index.json").write_text(
              json.dumps(idx,indent=2)+"\n"
          )
          PY

      - name: Validate every test-cart pin online and pack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/bryanthaboi/gen1recomp/dev/tools/cartkit.py -o /tmp/cartkit.py
          python /tmp/cartkit.py validate cart_source/gate_1_irregular_test --online --strict
          python /tmp/cartkit.py pack cart_source/gate_1_irregular_test             -o /tmp/gate_1_irregular_test-0.1.0.g1rcart --online

      - name: Publish Gate 1 test cart metadata
        run: |
          mkdir -p site/data/carts/DuskPromised@gate_1_irregular_test
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path

          src=Path("/tmp/gate_1_irregular_test-0.1.0.g1rcart")
          out=Path("site/data/carts/DuskPromised@gate_1_irregular_test")
          dst=out/src.name
          shutil.copy2(src,dst)
          shutil.copy2("cart_source/gate_1_irregular_test/label.png",out/"label.png")

          body=dst.read_bytes()
          sha=hashlib.sha256(body).hexdigest()
          idxp=Path("carts/gate_1_irregular_test.index.json")
          idx=json.loads(idxp.read_text())
          idx["latest"]={
            "version":"0.1.0","name":"0.1.0","prerelease":True,
            "zip":{
              "name":dst.name,
              "url":"https://duskpromised.github.io/gen1recomp-mod-index/data/carts/DuskPromised@gate_1_irregular_test/"+dst.name,
              "size":len(body),"sha256":sha
            }
          }
          idx["thumbnail"]="data/carts/DuskPromised@gate_1_irregular_test/label.png"
          idx["update_check"]="ok"
          idxp.write_text(json.dumps(idx,indent=2)+"\n")
          Path("/tmp/cart_sha.txt").write_text(sha)
          print("GATE1_TEST_CART_SHA="+sha)
          PY

      - name: Commit Gate 1 test artifacts to build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             mods/red-earth-gate1-test-harness             custom_mods/red_earth_gate1_test_harness.index.json             custom_mods/red_earth_gate1_test_harness.sha256             cart_source/gate_1_irregular_test             carts/gate_1_irregular_test.index.json

          git add -f             site/data/mods/DuskPromised@red_earth_gate1_test_harness/red_earth_gate1_test_harness-0.1.0.zip             site/data/carts/DuskPromised@gate_1_irregular_test/gate_1_irregular_test-0.1.0.g1rcart             site/data/carts/DuskPromised@gate_1_irregular_test/label.png

          if git diff --cached --quiet; then
            echo "Gate 1 test artifacts already current."
          else
            git commit -m "Publish Gate 1 test harness and sealed QA cart"
            git push origin HEAD:gate1-test-build
          fi
